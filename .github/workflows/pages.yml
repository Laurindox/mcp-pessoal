name: Publicar no GitHub Pages

# O bloco `environment: github-pages` foi removido de proposito.
# Ele so existe DEPOIS que o Pages esta habilitado, entao o job morria
# em 3 segundos, antes de chegar no passo que habilita. Catch-22.
# Sem ele, o configure-pages roda, liga o Pages pela API, e o deploy segue.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URL final
        run: echo "Site em ${{ steps.deployment.outputs.page_url }}"
